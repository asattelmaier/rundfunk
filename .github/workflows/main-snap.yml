name: CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main-snap.yml"
      - ".python-version"
      - "pyproject.toml"
      - "snap/**"
      - "src/**"
      - "tests/**"
      - "tooling/**"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/main-snap.yml"
      - ".python-version"
      - "pyproject.toml"
      - "snap/**"
      - "src/**"
      - "tests/**"
      - "tooling/**"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Snap channel, e.g. latest/edge (empty = no publish)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate uv package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Check CLI version
        run: uv run python -m rundfunk --version

      - name: Build package artifacts
        run: uv build

  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: tooling/scripts/lint.sh

      - name: Run tests
        run: tooling/scripts/test.sh -v

  package-oldest-supported:
    name: Build wheel on Python 3.8
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.8"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel

  build-amd64:
    name: Build core20 snap (amd64)
    needs:
      - lint-and-test
      - package
      - package-oldest-supported
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        with:
          snapcraft-channel: 8.x/stable

      - name: Upload snap artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-snap-amd64-${{ github.sha }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  build-arm64:
    name: Build core20 snap (arm64)
    if: github.event_name != 'pull_request'
    needs:
      - lint-and-test
      - package
      - package-oldest-supported
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        with:
          snapcraft-channel: 8.x/stable

      - name: Upload snap artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-snap-arm64-${{ github.sha }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  publish:
    name: Publish to Snap Store
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_channel != ''
    runs-on: ubuntu-24.04
    needs:
      - build-amd64
      - build-arm64
    environment: main-release

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: main-snap-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable

      - name: Publish all built snaps
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -eu
          channel="$RELEASE_CHANNEL"
          shopt -s nullglob
          snaps=(dist/*.snap)
          if [ "${#snaps[@]}" -eq 0 ]; then
            echo "No snap files found in dist/"
            exit 1
          fi
          for snap in "${snaps[@]}"; do
            echo "Publishing $snap to $channel"
            snapcraft upload --release "$channel" "$snap"
          done
