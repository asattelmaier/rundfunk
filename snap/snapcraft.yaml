name: rundfunk
base: core24
adopt-info: rundfunk
summary: Unofficial Deutschlandradio player for your Linux system tray
description: |
  Listen to Deutschlandfunk, Deutschlandfunk Kultur and Deutschlandfunk
  Nova live from your Linux system tray.

  Rundfunk is an unofficial client and not affiliated with
  Deutschlandradio.

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:
  armhf:
  riscv64:

apps:
  rundfunk:
    environment:
      GIO_USE_PROXY_RESOLVER: libproxy
    command: bin/run-rundfunk
    extensions: [gnome]
    plugs:
      - audio-playback
      - network
    slots:
      - mpris

parts:
  launcher:
    plugin: dump
    source: ./snap/local
    organize:
      run-rundfunk: bin/run-rundfunk

  rundfunk:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
    # Only what the gnome-46-2404 platform lacks.
    stage-packages:
      - python3-gst-1.0
      - python3-pydbus
    stage:
      - usr/lib/python3/dist-packages/gi/overrides/Gst*.py
      - usr/lib/python3/dist-packages/gi/overrides/_gi_gst*.so
      - usr/lib/python3/dist-packages/pydbus*
      - usr/lib/python3/dist-packages/rundfunk*
    override-pull: |
      craftctl default
      version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/rundfunk/__init__.py)"
      test -n "$version"
      craftctl set version="$version"
    override-build: |
      rm -rf build
      python3 -m pip install \
        --disable-pip-version-check \
        --no-cache-dir \
        --no-deps \
        --target "$CRAFT_PART_INSTALL/usr/lib/python3/dist-packages" \
        .

lint:
  ignore:
    # Its dependencies come from the gnome-46-2404 platform at runtime.
    - library:
        - usr/lib/python3/dist-packages/gi/overrides/_gi_gst*.so
